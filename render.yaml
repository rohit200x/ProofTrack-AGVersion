# Render.com Free-Tier Blueprint for ProofTrack
# Deploy in 1 click at: https://dashboard.render.com/blueprints
databases:
  - name: prooftrack-db
    databaseName: prooftrack
    user: prooftrack
    plan: free

services:
  # 1. FastAPI Backend Web Service (Free Docker Tier)
  - type: web
    name: prooftrack-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: prooftrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ON_STARTUP
        value: "true"
      # Uses in-memory object storage out of the box so 1-click deploy works with 0 extra accounts.
      # To switch to persistent cloud S3 (e.g. free Supabase Storage S3 or Cloudflare R2),
      # change STORAGE_BACKEND to "s3" and set S3_ENDPOINT_URL, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY.
      - key: STORAGE_BACKEND
        value: memory

  # 2. React + TypeScript Frontend (Free Static Site with /api proxy rewrite)
  - type: web
    name: prooftrack-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://prooftrack-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
