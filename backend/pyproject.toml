[project]
name = "prooftrack-backend"
version = "1.0.0"
description = "ProofTrack Logistics Delivery Management & Proof of Delivery API"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "boto3==1.43.115",
    "email-validator==2.3.0",
    "fastapi==0.151.0",
    "pillow==13.0.0",
    "pillow_heif==1.8.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-multipart==0.0.32",
    "SQLAlchemy==2.1.5",
    "tzdata==2026.5",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
